# .github/workflows/structured-data.yml
# Continuous integration check that JSON-LD on the site validates against
# both schema.org and Google's rich-result requirements.
# Uses structured-data-testing-tool (sdtt) from npm.

name: Structured Data Validation
on: [pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm i -g structured-data-testing-tool

      - name: Validate
        run: |
          for url in $(cat urls.txt); do
            sdtt --url "$url" --presets Google Schema || exit 1
          done
